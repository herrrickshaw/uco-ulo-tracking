[tool.ruff]
line-length = 200
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
# FastAPI idiom: Depends(...) in argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing test style (semicolon one-liners, short names); not worth churning.
"backend/tests/*" = ["E702", "E741", "F841"]
